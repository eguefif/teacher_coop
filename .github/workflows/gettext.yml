name: Gettext

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gettext:
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-type: strict
          version-file: .tool-versions

      - name: Restore deps and _build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check extracted messages are up to date
        run: |
          mix gettext.extract --merge
          if ! git diff --exit-code -- priv/gettext; then
            echo "::error::Gettext files are out of date. Run 'mix gettext.extract --merge' and commit the result."
            exit 1
          fi

      - name: Check translations are complete
        run: mix gettext.check_translations
