name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "eguefif/teacher_coop:latest" -t "eguefif/teacher_coop:${TAG}" .
          docker push "eguefif/teacher_coop:latest"
          docker push "eguefif/teacher_coop:${TAG}"

      - name: Deploy to Portainer using Webhook
        run: |
          # Make sure the tag is resolvable on Docker Hub before triggering
          for i in 1 2 3 4 5; do
            docker manifest inspect "eguefif/teacher_coop:${TAG}" >/dev/null && break
            sleep 5
          done
          curl -fsS -X POST \
            --retry 5 --retry-delay 10 --retry-all-errors --max-time 120 \
            "https://portainer.teachercoop.org/api/stacks/webhooks/${{ secrets.PORTAINER_APP_WEBHOOK }}?IMAGE_TAG=${TAG}"
