name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "eguefif/teacher_coop:latest" -t "eguefif/teacher_coop:${TAG}" .
          docker push "eguefif/teacher_coop:latest"
          docker push "eguefif/teacher_coop:${TAG}"

      - name: Deploy to Portainer using Webhook
        run: curl -fsS -X POST "https://portainer.teachercoop.org/api/stacks/webhooks/${{secrets.PORTAINER_APP_WEBHOOK}}?IMAGE_TAG=${TAG}"
